# 觀測後端 Seq（結構化日誌 + OpenTelemetry 追蹤/指標查詢 UI）。
# 啟動：docker compose -f docker-compose.observability.yml up -d
# UI：   http://localhost:5341   （OTLP 接收：http://localhost:5341/ingest/otlp）
# 停止： docker compose -f docker-compose.observability.yml down
services:
  seq:
    image: datalust/seq:latest
    container_name: tongpin-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped

volumes:
  seq-data:
