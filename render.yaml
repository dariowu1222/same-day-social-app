# Render Blueprint —— 同頻 Today 後端（.NET 8 Web API）
#
# 用法：Render Dashboard → New → Blueprint → 選這個 repo，它會讀這個檔自動建立服務。
# 標記 sync: false 的變數不會寫在這裡（機密），要在 Render 網頁的 Environment 分頁自己填。
# 詳細步驟見 docs/deploy-render.md
#
# 免費方案注意：15 分鐘無流量會自動休眠，下一個請求要等約 50 秒冷啟動。

services:
  - type: web
    name: tongpin-api
    runtime: docker
    plan: free
    region: singapore                 # 離台灣最近的免費區域
    dockerfilePath: ./backend/Dockerfile
    # context 是整個 repo 而不是 backend/：映像要同時包含後台 SPA 的原始碼。
    # 根目錄的 .dockerignore 負責把 frontend/、node_modules、本機機密擋在外面，
    # 沒有它的話 build context 會大到拖垮部署時間。
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit         # push 到 main 就自動重新部署

    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # 觀測性：正式環境沒有 OTLP collector，留空即關閉（否則會一直嘗試送到 localhost）
      - key: Observability__OtlpEndpoint
        value: ""

      # JWT 簽章密鑰：由 Render 產生並固定保存（換掉會讓所有使用者被登出）
      # 需至少 32 位元組，否則後端會 fail-fast 拒絕啟動
      - key: Jwt__Secret
        generateValue: true

      # ── 以下為機密，請在 Render 網頁手動填入 ──────────────────
      # Supabase 連線字串。務必用 session pooler 的 5432（不是 6543），
      # 並在結尾加上連線池參數，否則連續請求會把 pooler 槽位吃滿導致整個服務卡死：
      #   ;Maximum Pool Size=8;Connection Idle Lifetime=20;Connection Pruning Interval=10;Timeout=15;Command Timeout=30
      - key: ConnectionStrings__DefaultConnection
        sync: false

      # 寄信（註冊驗證碼、密碼重設）。沒設的話 API 會明確回 SMTP_NOT_CONFIGURED，不會假裝成功
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        value: "587"
      - key: Smtp__EnableSsl
        value: "true"
      - key: Smtp__Username
        sync: false
      - key: Smtp__Password
        sync: false
      - key: Smtp__FromEmail
        sync: false
      - key: Smtp__FromName
        value: "同頻 Today"

      # 媒體儲存（Supabase Storage）。service key 是機密，只放後端
      - key: Media__Provider
        value: supabase
      - key: Media__Bucket
        value: media
      - key: Media__SupabaseUrl
        sync: false
      - key: Media__ServiceKey
        sync: false

      # Facebook 登入（App ID 已在 appsettings.json，非機密；Secret 才是機密）
      - key: Authentication__Facebook__AppSecret
        sync: false

      # 審核後台的白名單：逗號分隔的 userId。
      # 沒設 = 一個人都進不去（預設拒絕），所以正式環境一定要在 Render 的
      # Environment 分頁填上，否則部署出去的後台等於沒有人能用。
      # 改這個值要重新部署才會生效（啟動時讀一次）。
      - key: Moderation__AdminUserIds
        sync: false

      # 彙總推播：FCM 服務帳戶金鑰（base64）與排程觸發密鑰。
      # 兩者都沒設時整條推播鏈路自動停用（端點回 404、workflow 自己跳過），
      # 所以漏填不會壞掉，但也不會送出任何推播。
      - key: Push__FirebaseServiceAccountJsonBase64
        sync: false
      - key: Push__TriggerSecret
        sync: false

      # 排程維護（停權到期自動恢復）的觸發密鑰。
      # 沒設時端點回 404、workflow 自己跳過，停權期滿的人照樣登得進來
      # （登入已經自己判斷期限），只是 users.status 會一直停在 SUSPENDED，
      # 後台的列表與計數就跟著一直是錯的。
      # 值要和 GitHub repo secret 的 MAINTENANCE_TRIGGER_SECRET 一致。
      - key: Maintenance__TriggerSecret
        sync: false

      # 「今日」的 AI 標籤分析（OpenAI）。沒設就整條停用，背景 worker 根本不啟動，
      # 今日照樣走原本的關鍵字分析器，所以漏填不會壞掉，只是前端那個
      # 「會員測試AI」勾起來也不會有作用。
      # 模型預設 gpt-5-nano（價目表上最便宜的一顆），要換再設 Ai__Model。
      - key: Ai__ApiKey
        sync: false
